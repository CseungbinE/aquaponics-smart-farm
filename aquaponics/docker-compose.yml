version: '3.8'

services:
  aquaponics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquaponics-smartfarm
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.json:/app/config.json
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    devices:
      # [변경] Arduino Serial Connection (USB Cable)
      # 상황에 따라 /dev/ttyACM0 일 수도 있습니다.
      - /dev/ttyUSB0:/dev/ttyUSB0
      
      # [삭제됨] I2C, GPIO, 1-Wire device mappings
      # 센서 제어 권한이 Arduino로 넘어갔으므로 Pi 컨테이너에는 필요 없습니다.
      
    # [선택] 시리얼 통신 권한 문제가 생길 경우 privileged 모드 유지
    privileged: true
    restart: unless-stopped
    networks:
      - aquaponics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  aquaponics-network:
    driver: bridge
