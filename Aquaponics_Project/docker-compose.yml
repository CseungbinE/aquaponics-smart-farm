version: '3.8'

services:
  aquaponics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquaponics-smartfarm
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.json:/app/config.json
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    devices:
      # I2C device (for ADS1115 ADC)
      - /dev/i2c-1:/dev/i2c-1
      # 1-Wire device (for DS18B20 temperature sensor)
      - /dev/ttyUSB0:/dev/ttyUSB0
      # GPIO access
      - /dev/mem:/dev/mem
      - /dev/gpiomem:/dev/gpiomem
    cap_add:
      - SYS_PTRACE
    privileged: true
    restart: unless-stopped
    networks:
      - aquaponics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  aquaponics-network:
    driver: bridge
